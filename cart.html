  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="js/config.js"></script>
  <script src="js/books.js"></script>
  <script src="js/cart.js"></script>
  <script>
    function renderCart() {
      const cart = getCart();
      const container = document.getElementById('cart-items');
      const summary = document.getElementById('cart-summary');

      if (cart.length === 0) {
        container.innerHTML = `
          <div class="empty-cart">
            <div class="empty-cart-icon">&#128218;</div>
            <h2>Your cart is empty</h2>
            <p>Browse our divine collection and add some books!</p>
            <a href="index.html">Continue Shopping &rarr;</a>
          </div>
        `;
        summary.style.display = 'none';
        return;
      }

      container.innerHTML = cart.map(item => {
        const book = BOOKS.find(b => b.id === item.bookId);
        if (!book) return '';
        return `
          <div class="cart-item">
            <img src="${book.image}" alt="${book.title}" class="cart-item-image" onerror="this.style.background='linear-gradient(145deg, #f8f4ec, #f0e8d8)';" />
            <div class="cart-item-details">
              <h3 class="cart-item-title">${book.title}</h3>
              <p class="cart-item-price">Rs. ${book.price}</p>
            </div>
            <div class="quantity-control">
              <button class="quantity-btn" onclick="updateQty(${book.id}, -1)">&#8722;</button>
              <input type="text" class="quantity-input" value="${item.quantity}" readonly />
              <button class="quantity-btn" onclick="updateQty(${book.id}, 1)">+</button>
            </div>
            <strong style="font-size:1.15rem;color:var(--accent);">Rs. ${book.price * item.quantity}</strong>
            <button onclick="removeItem(${book.id})" style="background:none;border:none;cursor:pointer;font-size:1.5rem;color:var(--danger);transition:var(--transition-fast);padding:0.5rem;" title="Remove">&#10005;</button>
          </div>
        `;
      }).join('');

      const subtotal = getCartTotal();
      document.getElementById('subtotal').textContent = `Rs. ${subtotal}`;
      document.getElementById('total').textContent = `Rs. ${subtotal + CONFIG.DELIVERY_CHARGE}`;
      summary.style.display = 'block';
    }

    function updateQty(bookId, delta) {
      const cart = getCart();
      const item = cart.find(i => i.bookId === bookId);
      if (item) {
        const newQty = item.quantity + delta;
        updateQuantity(bookId, newQty);
        renderCart();
      }
    }

    function removeItem(bookId) {
      removeFromCart(bookId);
      renderCart();
    }

    // Load books dynamically before rendering cart
    async function initCart() {
      const container = document.getElementById('cart-items');
      container.innerHTML = '<div class="spinner"></div>';
      await fetchBooks();
      renderCart();
    }
    initCart();
  </script>
</body>
</html>
