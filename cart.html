<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Cart - Gurudev Books</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header id="main-header">
    <div class="header-content">

          <path d="M44 15 L44 58 C44 62, 46 64, 50 64 C54 64, 56 62, 56 58 L56 15" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />
          <path d="M50 72 C46 76, 43 83, 50 90 C57 83, 54 76, 50 72 Z" fill="currentColor" />
        </svg>
      </a>
      <nav>
        <a href="index.html" class="nav-link">
          <svg class="nav-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
          Books
        </a>
        <a href="track.html" class="nav-link">
          <svg class="nav-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="3" width="15" height="13"></rect><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"></polygon><circle cx="5.5" cy="18.5" r="2.5"></circle><circle cx="18.5" cy="18.5" r="2.5"></circle></svg>
          Track Order
        </a>

        <a href="cart.html" class="nav-link">
          <div class="cart-icon-wrapper">
            <svg class="nav-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
            <span id="cart-badge" class="cart-badge" style="display:none;">0</span>
          </div>
          Cart
        </a>
      </nav>
    </div>
  </header>

  <main class="container cart-page">
    <div class="page-title">
      <h1>My Shopping Cart</h1>
    </div>

    <!-- Test Mode Notice Banner (dynamically shown when ?test=1 or localStorage) -->
    <div id="test-mode-banner" style="display:none;width:100%;margin-bottom:1.5rem;padding:1rem 1.25rem;background:#FEF3C7;border:2px dashed #D97706;border-radius:var(--radius);color:#92400E;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:0.75rem;">
      <div style="display:flex;align-items:center;gap:0.75rem;">
        <span style="font-size:1.5rem;">🧪</span>
        <div>
          <strong style="display:block;font-size:0.95rem;">Test Mode Active</strong>
          <span style="font-size:0.85rem;color:#78350F;">Orders placed in test mode are tagged as test orders and will NOT affect physical inventory or revenue accounting.</span>
        </div>
      </div>
      <div style="display:flex;gap:0.5rem;align-items:center;">
        <button type="button" onclick="addSampleBooksAndRefresh()" style="background:#D97706;color:white;border:none;padding:0.45rem 0.9rem;border-radius:var(--radius-sm);font-weight:600;font-size:0.82rem;cursor:pointer;">🧪 Add Sample Books</button>
        <button type="button" onclick="exitTestMode()" style="background:white;color:#92400E;border:1px solid #D97706;padding:0.45rem 0.9rem;border-radius:var(--radius-sm);font-weight:600;font-size:0.82rem;cursor:pointer;">Exit Test Mode</button>
      </div>
    </div>

    <div id="cart-container" class="cart-container-box"></div>
  </main>

  <footer>
    <p>&copy; 2026 Gurudev Books Store. All rights reserved. | <a href="track.html">Track Your Order</a> | <a href="admin.html" style="opacity:0.65;font-size:0.9em;">Staff Login</a></p>
  </footer>

  <a href="https://wa.me/919403390876" target="_blank" class="whatsapp-float" title="Chat on WhatsApp">
    <span class="whatsapp-label">Have a Query? Chat on WhatsApp</span><svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><path d="M16.004 0C7.165 0 .003 7.161.001 15.999c-.001 2.819.736 5.571 2.138 7.998L.012 32l8.186-2.09a16.04 16.04 0 007.806 1.99h.006C24.838 31.9 32 24.738 32 15.999 32 7.161 24.838 0 16.004 0zm0 29.3a13.36 13.36 0 01-7.02-1.99l-.503-.3-5.22 1.332 1.393-5.093-.328-.523A13.27 13.27 0 012.6 15.999c0-7.39 6.015-13.4 13.404-13.4 7.39 0 13.398 6.01 13.398 13.4 0 7.39-5.998 13.301-13.398 13.301zm7.338-10.035c-.403-.2-2.378-1.173-2.747-1.308-.37-.134-.639-.2-.908.2s-1.042 1.308-1.278 1.576c-.236.268-.472.3-.875.1-.403-.2-1.704-.628-3.246-2.002-1.199-1.07-2.009-2.39-2.244-2.793-.236-.403-.025-.62.177-.82.182-.18.403-.47.604-.705.2-.236.268-.403.403-.671.134-.268.067-.503-.034-.705-.1-.2-1.008-2.428-1.378-3.328-.37-.9-.746-.774-1.008-.785-.268-.01-.57-.012-.872-.012-.302 0-.79.113-1.203.57-.403.457-1.538 1.504-1.538 3.668 0 2.164 1.572 4.26 1.791 4.562.219.302 3.093 4.723 7.491 6.617 1.05.453 1.868.723 2.507.926 1.051.334 2.006.287 2.761.175.842-.126 2.378-.973 2.714-1.912.336-.94.336-1.744.236-1.912-.1-.168-.37-.268-.773-.47z"/></svg>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="js/security.js"></script>
  <script src="js/config.js"></script>
  <script src="js/books.js"></script>
  <script src="js/cart.js"></script>
  <script>
    function checkTestMode() {
      const hasTestParam = new URLSearchParams(window.location.search).get('test') === '1' ||
                            new URLSearchParams(window.location.search).get('test') === 'true' ||
                            new URLSearchParams(window.location.search).get('test_mode') === 'true';

      const banner = document.getElementById('test-mode-banner');

      if (hasTestParam) {
        if (typeof CONFIG !== 'undefined' && CONFIG.isAuthorizedForTestMode && CONFIG.isAuthorizedForTestMode()) {
          if (banner) banner.style.display = 'flex';
          localStorage.setItem('gurudev_test_mode', 'true');
        } else {
          // Zero Public Access: Public visitor attempted to access test mode without admin login!
          if (typeof CONFIG !== 'undefined' && CONFIG.showAdminLoginRequiredNotice) {
            CONFIG.showAdminLoginRequiredNotice();
          }
          return;
        }
      } else if (typeof CONFIG !== 'undefined' && CONFIG.isTestMode && CONFIG.isTestMode()) {
        if (banner) banner.style.display = 'flex';
      }
    }

    function renderCart() {
      const cart = getCart();
      const container = document.getElementById('cart-container');
      const isTest = typeof CONFIG !== 'undefined' && CONFIG.isTestMode && CONFIG.isTestMode();

      if (cart.length === 0) {
        if (isTest) {
          container.innerHTML = `
            <div class="empty-cart" style="padding: 3rem 1.5rem; text-align: center; border: 2px dashed #D97706; border-radius: var(--radius); background: #FFFBEB;">
              <div class="empty-cart-icon" style="margin-bottom: 1rem; display: flex; justify-content: center; font-size: 3rem;">
                🧪
              </div>
              <h2 style="font-family:'Lora',serif;margin-bottom:0.5rem;color:#92400E;">Your Test Cart is Empty</h2>
              <p style="color: #78350F; margin-bottom: 1.5rem; max-width: 480px; margin-left: auto; margin-right: auto; line-height: 1.5;">
                You are in <strong>Test Mode</strong>. Click the button below to instantly load sample books into your cart and test the complete India Post calculation & checkout flow!
              </p>
              <div style="display:flex; gap:0.75rem; justify-content:center; flex-wrap:wrap;">
                <button type="button" onclick="addSampleBooksAndRefresh()" style="background:linear-gradient(135deg, #D97706, #B45309); color:white; border:none; padding:0.85rem 1.75rem; border-radius:var(--radius); font-weight:700; font-size:0.95rem; cursor:pointer; box-shadow:0 4px 12px rgba(217,119,6,0.3); display:inline-flex; align-items:center; gap:0.5rem;">
                  🧪 Add Sample Books to Cart & Test
                </button>
                <a href="index.html" style="text-decoration:none; display: inline-flex; align-items:center; padding:0.85rem 1.25rem; border:1px solid #D97706; border-radius:var(--radius); color:#92400E; font-weight:600; font-size:0.9rem; background:white;">Browse Store</a>
              </div>
            </div>
          `;
          container.style.border = 'none';
          container.style.boxShadow = 'none';
          container.style.background = 'transparent';
          return;
        }

        container.innerHTML = `
          <div class="empty-cart" style="padding: 4rem 1.5rem; text-align: center;">
            <div class="empty-cart-icon" style="margin-bottom: 1.25rem; display: flex; justify-content: center; color: var(--maroon);">
              <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
              </svg>
            </div>
            <h2 style="font-family:'Lora',serif;margin-bottom:0.5rem;color:var(--maroon);">Your cart is empty</h2>
            <p style="color: var(--text-secondary); margin-bottom: 1.75rem;">Browse our collection and add some books!</p>
            <a href="index.html" style="text-decoration:none; display: inline-block; max-width: 250px; text-align:center;">Continue Shopping &rarr;</a>
          </div>
        `;
        container.style.border = 'none';
        container.style.boxShadow = 'none';
        container.style.background = 'transparent';
        return;
      }

      // Restore container styles for active cart
      container.style.border = '';
      container.style.boxShadow = '';
      container.style.background = '';

      const itemsHtml = cart.map((item, index) => {
        const book = BOOKS.find(b => b.id === item.bookId);
        if (!book) return '';
        const authorText = "Sri Srimad Gour Govinda Swami Maharaja"; // Publisher/Author standard for this store
        return `
          <div class="bookwagon-cart-item">
            <div class="item-number-col">${index + 1}</div>
            
            <div class="item-image-col">
              <img src="${book.image}" alt="${book.title}" onerror="this.style.background='linear-gradient(145deg, #f8f4ec, #f0e8d8)';" />
            </div>
            
            <div class="item-details-col">
              <h3 class="item-title">${book.title}</h3>
              <p class="item-author">By: ${authorText}</p>
              <p class="item-price">Rs. ${book.price}</p>
              
              <div class="item-action-row">
                <div class="quantity-control">
                  <button class="quantity-btn" id="minus-${book.id}" onclick="updateQty(${book.id}, -1)" ${item.quantity <= 1 ? 'disabled' : ''}>&#8722;</button>
                  <input type="text" class="quantity-input" id="qty-${book.id}" value="${item.quantity}" readonly />
                  <button class="quantity-btn" id="plus-${book.id}" onclick="updateQty(${book.id}, 1)" ${item.quantity >= book.stock_quantity ? 'disabled' : ''}>+</button>
                </div>
                
                <span class="item-total-price">Total Price: <strong>Rs. ${book.price * item.quantity}</strong></span>
              </div>
            </div>
            
            <div class="item-actions-col">
              <button class="cart-remove-btn" onclick="removeItem(${book.id})">Remove</button>
            </div>
          </div>
        `;
      }).join('');

      const subtotal = getCartTotal();
      const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);

      // Compute total book weight + packing weight
      let totalBookWeight = 0;
      cart.forEach(item => {
        const book = BOOKS.find(b => b.id === item.bookId);
        const w = (book && book.weight_grams != null && Number(book.weight_grams) > 0)
          ? Number(book.weight_grams)
          : (CONFIG.DEFAULT_BOOK_WEIGHT_GRAMS || 150);
        totalBookWeight += (w * item.quantity);
      });
      const packingWeight = CONFIG.PACKING_WEIGHT_GRAMS || 20;
      const totalWeight = totalBookWeight + packingWeight;

      const checkoutUrl = isTest ? 'checkout.html?test=1' : 'checkout.html';
      const checkoutBtnText = isTest ? 'Proceed to Test Checkout &rarr;' : 'Proceed to Checkout &rarr;';
      const checkoutBtnStyle = isTest ? 'style="background:linear-gradient(135deg, #D97706, #B45309);"' : '';

      const summaryHtml = `
        <div class="bookwagon-summary">
          <div class="summary-left-col">
            <div class="summary-line"><span>Total Items</span><span>${totalItems}</span></div>
            <div class="summary-line"><span>Total Gross</span><span>Rs. ${subtotal}</span></div>
            <p class="delivery-estimate-text" style="display: flex; align-items: center; gap: 0.4rem; margin-top:0.4rem;">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="display: inline-block; vertical-align: middle;">
                <rect x="1" y="3" width="15" height="13"></rect>
                <polygon points="16 8 20 8 23 11 23 16 16 16 8"></polygon>
                <circle cx="5.5" cy="18.5" r="2.5"></circle>
                <circle cx="18.5" cy="18.5" r="2.5"></circle>
              </svg>
              Dispatched from Pune via India Post.
            </p>
          </div>
          <div class="summary-right-col">
            <div class="summary-line">
              <span>Postage</span>
              <span style="font-size:0.86rem;color:var(--saffron-dark);font-weight:600;">Calculated at checkout</span>
            </div>
            <div class="summary-line total-payable-line"><span>Cart Subtotal</span><span>Rs. ${subtotal}</span></div>
            <a href="${checkoutUrl}" style="text-decoration:none;"><button class="bookwagon-checkout-btn" ${checkoutBtnStyle}>${checkoutBtnText}</button></a>
          </div>
        </div>
      `;

      container.innerHTML = `
        <div class="cart-items-list-container">
          ${itemsHtml}
        </div>
        ${summaryHtml}
      `;
    }

    function addSampleBooksAndRefresh() {
      const catalog = typeof getCatalog === 'function' ? getCatalog() : (BOOKS || []);
      const item1 = (catalog && catalog.length > 0) ? catalog[0].id : 1;
      const item2 = (catalog && catalog.length > 1) ? catalog[1].id : 2;
      const sampleItems = [
        { bookId: item1, quantity: 1 },
        { bookId: item2, quantity: 1 }
      ];
      saveCart(sampleItems);
      updateCartBadge();
      renderCart();
      if (typeof showToast === 'function') {
        showToast('Sample books added to cart! Ready for test checkout.', 'success');
      }
    }

    function exitTestMode() {
      if (typeof CONFIG !== 'undefined' && CONFIG.setTestMode) {
        CONFIG.setTestMode(false);
      }
      const banner = document.getElementById('test-mode-banner');
      if (banner) banner.style.display = 'none';
      if (window.history && window.history.replaceState) {
        try {
          const url = new URL(window.location.href);
          url.searchParams.delete('test');
          url.searchParams.delete('test_mode');
          window.history.replaceState({}, document.title, url.pathname + (url.search ? url.search : ''));
        } catch (e) {}
      }
      renderCart();
      if (typeof showToast === 'function') {
        showToast('Exited Test Mode.', 'info');
      }
    }

    function updateQty(bookId, delta) {
      const cart = getCart();
      const item = cart.find(i => i.bookId === bookId);
      if (item) {
        const newQty = item.quantity + delta;
        updateQuantity(bookId, newQty);
        renderCart();
      }
    }

    function removeItem(bookId) {
      removeFromCart(bookId);
      renderCart();
    }

    // Load books dynamically before rendering cart
    async function initCart() {
      const container = document.getElementById('cart-container');
      container.innerHTML = '<div class="spinner"></div>';
      checkTestMode();
      await fetchBooks();
      renderCart();
    }
    initCart();
  </script>
</body>
</html>
