<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout - Gurudev Books</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header id="main-header">
    <div class="header-content">
      <a href="index.html" class="logo"><span class="logo-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="color:var(--maroon);"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg></span> Gurudev Books</a>
      <nav>
        <a href="index.html">Books</a>
        <a href="track.html">Track Order</a>
        <a href="admin.html">Admin</a>
        <a href="cart.html">Cart <span id="cart-badge" class="cart-badge" style="display:none;">0</span></a>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="page-title">
      <h1>Checkout</h1>
      <p>Complete your order with UPI payment</p>
    </div>

    <form id="checkout-form" onsubmit="submitOrder(event)" style="max-width:650px;margin:0 auto;">
      <div class="form-group">
        <label for="customer-name">Full Name</label>
        <input type="text" id="customer-name" required placeholder="Enter your full name" />
      </div>

      <div class="form-group">
        <label for="customer-phone">Phone Number</label>
        <input type="tel" id="customer-phone" required placeholder="10-digit mobile number" pattern="[0-9]{10}" />
      </div>

      <div class="form-group">
        <label for="customer-address">Delivery Address</label>
        <textarea id="customer-address" required placeholder="House No, Street, City, State, PIN Code"></textarea>
      </div>

      <div class="payment-section">
        <h2>Payment via UPI</h2>
        <p style="margin-bottom:1rem;color:var(--text-secondary);">Scan the QR code or use the UPI ID below to pay <strong id="pay-amount" style="color:var(--accent);font-size:1.25rem;">Rs. 0</strong></p>
        <div class="qr-code">
          <img src="assets/qr-code.png" alt="UPI QR Code" onerror="this.style.display='none';this.parentElement.textContent='Place your UPI QR code here';" />
        </div>
        <p style="color:var(--text-secondary);">UPI ID:</p>
        <span class="upi-id" id="upi-id-display"></span>
      </div>

      <div class="form-group">
        <label>Upload Payment Screenshot</label>
        <div class="file-upload">
          <input type="file" id="payment-proof" accept="image/*" required />
          <label for="payment-proof" class="file-upload-label">
            Click or drag to upload payment screenshot
          </label>
        </div>
      </div>

      <button type="submit" id="submit-order-btn" class="checkout-btn">Place Order</button>
    </form>
  </main>

  <footer>
    <p>&copy; 2026 Gurudev Books Store. All rights reserved. | <a href="track.html">Track Your Order</a></p>
  </footer>

  <a href="https://wa.me/918307566768" target="_blank" class="whatsapp-float" title="Chat on WhatsApp">
    <span class="whatsapp-label">Have a Query? Chat on WhatsApp</span><svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><path d="M16.004 0C7.165 0 .003 7.161.001 15.999c-.001 2.819.736 5.571 2.138 7.998L.012 32l8.186-2.09a16.04 16.04 0 007.806 1.99h.006C24.838 31.9 32 24.738 32 15.999 32 7.161 24.838 0 16.004 0zm0 29.3a13.36 13.36 0 01-7.02-1.99l-.503-.3-5.22 1.332 1.393-5.093-.328-.523A13.27 13.27 0 012.6 15.999c0-7.39 6.015-13.4 13.404-13.4 7.39 0 13.398 6.01 13.398 13.4 0 7.39-5.998 13.301-13.398 13.301zm7.338-10.035c-.403-.2-2.378-1.173-2.747-1.308-.37-.134-.639-.2-.908.2s-1.042 1.308-1.278 1.576c-.236.268-.472.3-.875.1-.403-.2-1.704-.628-3.246-2.002-1.199-1.07-2.009-2.39-2.244-2.793-.236-.403-.025-.62.177-.82.182-.18.403-.47.604-.705.2-.236.268-.403.403-.671.134-.268.067-.503-.034-.705-.1-.2-1.008-2.428-1.378-3.328-.37-.9-.746-.774-1.008-.785-.268-.01-.57-.012-.872-.012-.302 0-.79.113-1.203.57-.403.457-1.538 1.504-1.538 3.668 0 2.164 1.572 4.26 1.791 4.562.219.302 3.093 4.723 7.491 6.617 1.05.453 1.868.723 2.507.926 1.051.334 2.006.287 2.761.175.842-.126 2.378-.973 2.714-1.912.336-.94.336-1.744.236-1.912-.1-.168-.37-.268-.773-.47z"/></svg>
  </a>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="js/config.js"></script>
  <script src="js/books.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/checkout.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const cart = getCart();
      if (cart.length === 0) {
        window.location.href = 'cart.html';
        return;
      }
      await fetchBooks();
      const total = getCartTotal() + CONFIG.DELIVERY_CHARGE;
      document.getElementById('pay-amount').textContent = `Rs. ${total}`;
      document.getElementById('upi-id-display').textContent = CONFIG.UPI_ID;
    });

    document.getElementById('payment-proof').addEventListener('change', function() {
      const label = document.querySelector('.file-upload-label');
      label.textContent = this.files[0] ? `Selected: ${this.files[0].name}` : 'Click or drag to upload payment screenshot';
    });
  </script>
</body>
</html>
