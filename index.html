  <script>
    // Scroll animations for header and hero
    const header = document.getElementById('main-header');
    const hero = document.getElementById('hero');
    const heroBg = hero ? hero.querySelector('.hero-bg-mandala') : null;
    const heroInfo = hero ? hero.querySelector('.hero-info') : null;
    const deityImg = hero ? hero.querySelector('.hero-image-left') : null;
    const gurusImg = hero ? hero.querySelector('.hero-image-right') : null;

    let ticking = false;

    function updateOnScroll() {
      if (!hero) return;
      const scrollY = window.scrollY;
      const heroHeight = hero.offsetHeight || 1;
      const scrollRatio = Math.min(scrollY / heroHeight, 1);

      // Header: gradient -> solid
      if (header) {
        if (scrollY > 50) {
          header.classList.add('scrolled');
        } else {
          header.classList.remove('scrolled');
        }
      }

      // Hero parallax effects
      if (scrollY < heroHeight) {
        const fadeOpacity = 1 - (scrollRatio * 1.5);
        const translateY = scrollY * 0.3;

        hero.style.opacity = Math.max(fadeOpacity, 0);
        hero.style.transform = `translateY(${translateY * 0.2}px)`;

        // Background mandala parallax
        if (heroBg) {
          heroBg.style.transform = `translate(-50%, -50%) scale(${1 + scrollRatio * 0.2})`;
        }

        // Info section fades faster
        if (heroInfo) {
          heroInfo.style.transform = `translateY(${translateY * 0.5}px)`;
          heroInfo.style.opacity = Math.max(1 - (scrollRatio * 2), 0);
        }

        // Images move slightly
        if (deityImg) {
          deityImg.style.transform = `translateY(${translateY * 0.1}px)`;
        }
        if (gurusImg) {
          gurusImg.style.transform = `translateY(${translateY * 0.15}px)`;
        }
      }

      ticking = false;
    }

    window.addEventListener('scroll', () => {
      if (!ticking) {
        requestAnimationFrame(updateOnScroll);
        ticking = true;
      }
    }, { passive: true });

    // Initial call
    updateOnScroll();

    function renderBooks() {
      const grid = document.getElementById('book-grid');
      if (BOOKS.length === 0) {
        grid.innerHTML = '<p style="text-align:center;color:var(--text-secondary);padding:3rem 0;">No books found in the store.</p>';
        return;
      }
      grid.innerHTML = BOOKS.map(book => {
        const isOutOfStock = book.stock_quantity <= 0;
        const actionsHtml = isOutOfStock
          ? `<span class="out-of-stock-label" style="color:var(--danger);font-weight:600;font-size:0.95rem;padding:0.5rem 1rem;">Out of Stock</span>`
          : `
            <div class="quantity-control">
              <button class="quantity-btn" id="minus-${book.id}" onclick="changeQty(${book.id}, -1)" disabled>&#8722;</button>
              <input type="text" class="quantity-input" id="qty-${book.id}" value="1" readonly />
              <button class="quantity-btn" id="plus-${book.id}" onclick="changeQty(${book.id}, 1)" ${book.stock_quantity <= 1 ? 'disabled' : ''}>+</button>
            </div>
            <button class="add-to-cart-btn" onclick="handleAddToCart(${book.id})">Add to Cart</button>
          `;

        return `
          <div class="book-card">
            <div class="book-image-wrapper">
              <img src="${book.image}" alt="${book.title}" onerror="this.style.display='none';this.parentElement.textContent='Book Cover';" />
            </div>
            <div class="book-info">
              <h2 class="book-title">${book.title}</h2>
              <div class="book-description">
                ${book.description}
              </div>
              <div class="book-meta">
                <span class="meta-tag">
                  <svg class="meta-tag-icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
                  ${book.type || 'Book'}
                </span>
                <span class="meta-tag">
                  <svg class="meta-tag-icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>
                  ${book.pages || 0} pages
                </span>
                ${book.dimensions ? `
                  <span class="meta-tag">
                    <svg class="meta-tag-icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="10" rx="2" ry="2"></rect><line x1="6" y1="7" x2="6" y2="11"></line><line x1="10" y1="7" x2="10" y2="11"></line><line x1="14" y1="7" x2="14" y2="11"></line><line x1="18" y1="7" x2="18" y2="11"></line></svg>
                    ${book.dimensions}
                  </span>` : ''}
              </div>
              <div class="book-bottom">
                <span class="book-price">Rs. ${book.price}</span>
                <div class="book-actions">
                  ${actionsHtml}
                </div>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function changeQty(bookId, delta) {
      const input = document.getElementById(`qty-${bookId}`);
      const minusBtn = document.getElementById(`minus-${bookId}`);
      const plusBtn = document.getElementById(`plus-${bookId}`);

      let val = parseInt(input.value) + delta;
      const book = BOOKS.find(b => b.id === bookId);
      const maxStock = book ? book.stock_quantity : 10;

      if (val <= 1) {
        val = 1;
        if (minusBtn) minusBtn.disabled = true;
      } else {
        if (minusBtn) minusBtn.disabled = false;
      }

      if (val >= maxStock) {
        // Trigger alert only if user attempts to go over current max limit
        if (delta > 0 && parseInt(input.value) === maxStock) {
          showToast(`Only ${maxStock} copies of "${book.title}" are available in stock.`, 'warning');
        }
        val = maxStock;
        if (plusBtn) plusBtn.disabled = true;
      } else {
        if (plusBtn) plusBtn.disabled = false;
      }

      input.value = val;
    }

    function handleAddToCart(bookId) {
      const qty = parseInt(document.getElementById(`qty-${bookId}`).value);
      addToCart(bookId, qty);

      // Reset input to 1
      document.getElementById(`qty-${bookId}`).value = 1;

      // Reset plus/minus button states
      const minusBtn = document.getElementById(`minus-${bookId}`);
      const plusBtn = document.getElementById(`plus-${bookId}`);
      const book = BOOKS.find(b => b.id === bookId);
      if (minusBtn) minusBtn.disabled = true;
      if (plusBtn) plusBtn.disabled = book ? book.stock_quantity <= 1 : false;
    }

    // Load books dynamically on startup
    async function initCatalog() {
      const grid = document.getElementById('book-grid');
      grid.innerHTML = '<div class="spinner"></div>';
      await fetchBooks();
      renderBooks();
    }
    initCatalog();
  </script>
