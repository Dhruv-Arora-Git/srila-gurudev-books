  <main class="container">

      <p>Enter your phone number to view order status</p>
    </div>

    <div class="track-form">
      <form onsubmit="trackOrders(event)">
        <div class="form-group">
          <label for="track-phone">Phone Number</label>
          <input type="tel" id="track-phone" required placeholder="10-digit mobile number" pattern="[0-9]{10}" />
        </div>
        <button type="submit" class="checkout-btn">Track Orders</button>
      </form>
    </div>

    <div id="track-results" class="track-results"></div>

  <script src="js/books.js"></script>
  <script src="js/cart.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const savedPhone = localStorage.getItem('last_tracked_phone');
      if (savedPhone) {
        document.getElementById('track-phone').value = savedPhone;
        trackOrders();
      }
